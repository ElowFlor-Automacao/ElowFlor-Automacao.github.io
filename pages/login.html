<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Cliente | ElowFlor</title>
    <meta name="description" content="Área do cliente ElowFlor — acesse o painel de monitoramento dos seus silos.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#236D75">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
    <link rel="apple-touch-icon" href="/assets/favicon-192.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Estilos Globais -->
    <link rel="stylesheet" href="/styles/styles.css?v=3">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            teal: '#236D75',
                            'teal-deep': '#1A5258',
                            green: '#4D8329',
                            blue: '#1B6790',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 hero-gradient font-sans antialiased">

    <!-- Container Principal -->
    <div class="max-w-md w-full">
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden relative">
        <div class="h-1.5 w-full bg-brand-teal"></div>

        <div class="p-8 sm:p-10">
            <!-- Cabeçalho / Logo -->
            <div class="text-center mb-8">
                <a href="/" class="inline-flex items-center justify-center gap-2.5 mb-6" aria-label="ElowFlor — página inicial">
                    <img src="/assets/logo-mark.png" alt="" width="128" height="128" class="h-10 w-10">
                    <img src="/assets/logo-wordmark.png" alt="ElowFlor" width="365" height="96" class="h-7 w-auto">
                </a>
                <h1 class="text-2xl font-bold text-gray-900 mb-2 tracking-tight">Bem-vindo!</h1>
                <p class="text-gray-500 text-sm">Por favor, insira seus dados para continuar.</p>
            </div>

            <!-- Formulário -->
            <form id="loginForm" class="space-y-6">
                <!-- Campo de Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="ph ph-envelope-simple text-gray-400 text-lg" aria-hidden="true"></i>
                        </div>
                        <input type="email" id="email" name="email" required
                            class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-blue/40 focus:border-brand-blue transition bg-white"
                            placeholder="seu@email.com">
                    </div>
                </div>

                <!-- Campo de Senha -->
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label for="password" class="block text-sm font-medium text-gray-700">Senha</label>
                        <a href="#" class="text-xs font-medium text-brand-blue hover:text-brand-teal transition-colors">Esqueceu a senha?</a>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="ph ph-lock-key text-gray-400 text-lg" aria-hidden="true"></i>
                        </div>
                        <input type="password" id="password" name="password" required
                            class="block w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-blue/40 focus:border-brand-blue transition bg-white"
                            placeholder="••••••••">
                        <button type="button" id="togglePassword" aria-label="Mostrar senha" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                            <i class="ph ph-eye text-lg" aria-hidden="true" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Lembrar-me -->
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox"
                        class="h-4 w-4 text-brand-teal focus:ring-brand-teal border-gray-300 rounded cursor-pointer accent-brand-teal">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-600 cursor-pointer">
                        Lembrar de mim
                    </label>
                </div>

                <!-- Mensagem de erro/sucesso (Oculta por padrão) -->
                <div id="messageBox" class="hidden rounded-lg p-4 text-sm" role="status" aria-live="polite">
                </div>

                <!-- Botão de Enviar -->
                <button type="submit" id="submitBtn"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-brand-teal hover:bg-brand-teal-deep transition-colors duration-300 relative">
                    <span id="btnText">Entrar na conta</span>
                    <i class="ph ph-spinner-gap animate-spin hidden text-xl absolute" id="btnSpinner"></i>
                </button>
            </form>
        </div>
        </div>

        <p class="text-center mt-6 text-sm text-teal-50/90">
            <a href="/" class="hover:text-white hover:underline inline-flex items-center gap-1.5">
                <i class="ph ph-arrow-left" aria-hidden="true"></i> Voltar ao site
            </a>
        </p>
    </div>

    <!-- Lógica JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            const loginForm = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const messageBox = document.getElementById('messageBox');

            // Alternar visibilidade da senha
            togglePassword.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                const visivel = type === 'text';
                eyeIcon.classList.toggle('ph-eye', !visivel);
                eyeIcon.classList.toggle('ph-eye-slash', visivel);
                togglePassword.setAttribute('aria-label', visivel ? 'Ocultar senha' : 'Mostrar senha');
            });

            // Simular envio do formulário
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Resetar mensagens
                messageBox.classList.add('hidden');
                messageBox.classList.remove('bg-red-50', 'text-red-800', 'bg-green-50', 'text-green-800');
                
                // Estado de carregamento
                submitBtn.disabled = true;
                btnText.classList.add('opacity-0');
                btnSpinner.classList.remove('hidden');

                // Simular uma requisição à API (delay de 1.5s)
                setTimeout(() => {
                    const email = document.getElementById('email').value;
                    
                    // Estado normal do botão
                    submitBtn.disabled = false;
                    btnText.classList.remove('opacity-0');
                    btnSpinner.classList.add('hidden');

                    // Simulação de validação simples
                    if(email) {
                        messageBox.innerHTML = '<div class="flex items-center"><i class="ph ph-check-circle mr-2 text-lg"></i> Login efetuado com sucesso!</div>';
                        messageBox.classList.add('bg-green-50', 'text-green-800');
                        messageBox.classList.remove('hidden');
                        
                        // Limpar formulário (opcional)
                        // loginForm.reset();
                    } else {
                        messageBox.innerHTML = '<div class="flex items-center"><i class="ph ph-warning-circle mr-2 text-lg"></i> Ocorreu um erro ao fazer login.</div>';
                        messageBox.classList.add('bg-red-50', 'text-red-800');
                        messageBox.classList.remove('hidden');
                    }
                }, 1500);
            });
        });
    </script>
</body>
</html>
